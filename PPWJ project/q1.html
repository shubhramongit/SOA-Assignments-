<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Online Quiz Application</title>
  <link rel="stylesheet" href="minorproject.css">
</head>
<body>
  <div class="quiz-container fade-in">
    <h2>Online Quiz Application</h2>

    <div id="question" class="question">
      Click the button below to start!
    </div>

    <div class="options" id="options-container">
      <button class="option" onclick="checkAnswer(this)"></button>
      <button class="option" onclick="checkAnswer(this)"></button>
      <button class="option" onclick="checkAnswer(this)"></button>
      <button class="option" onclick="checkAnswer(this)"></button>
    </div>

    <div class="controls">
      <button id="startBtn" onclick="startQuiz()">Start Quiz</button>
      <button id="nextBtn" onclick="nextQuestion()">Next</button>
    </div>

    <div id="score">Score: 0</div>
  </div>

  <script src="minorproject.js"></script>
</body>
</html>
